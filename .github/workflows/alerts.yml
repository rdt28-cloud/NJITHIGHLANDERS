name: Game-day alerts

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may run a few minutes late)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot-data
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: pip install --quiet requests
      - name: Send due alerts
        env:
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
        run: python -m bot alerts
      - name: Save sent-alert log
        run: |
          if [ -n "$(git status --porcelain data/state.json)" ]; then
            git config user.name "njit-gameday-bot"
            git config user.email "njit-gameday-bot@users.noreply.github.com"
            git add data/state.json
            git commit -m "Log sent alerts" --quiet
            git pull --rebase --quiet && git push --quiet
          fi
