name: Refresh schedules

on:
  schedule:
    - cron: "7 10 * * *"   # daily ~6 AM Eastern, before the 9 AM game-day alerts
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: pip install --quiet requests beautifulsoup4
      - name: Read every NJIT schedule
        run: python -m bot refresh
      - name: Save schedules
        run: |
          if [ -n "$(git status --porcelain data/games.json data/rosters.json)" ]; then
            git config user.name "njit-gameday-bot"
            git config user.email "njit-gameday-bot@users.noreply.github.com"
            git add data/games.json data/rosters.json
            git commit -m "Update game schedules" --quiet
            git pull --rebase --quiet && git push --quiet
          fi
